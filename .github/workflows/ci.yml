name: ITSM CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore dependencies
        run: dotnet restore ITSM.sln

      - name: Build solution
        run: dotnet build ITSM.sln --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test Application.Tests/Application.Tests.csproj --configuration Release --no-build

      - name: Run integration tests
        run: dotnet test IntegrationTests/IntegrationTests.csproj --configuration Release --no-build
